<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KurlyPay PG 시스템 | Back Office</title>
    <meta name="description" content="컬리페이 PG 시스템 백오피스 - 정산시스템" />
    <!--
      GitHub Pages SPA 폴백 복원 스크립트.
      404.html 이 ?/경로 형태로 넘긴 원래 경로를 정상 URL 로 복원한다.
      (반드시 React 앱 로드 전에 실행되어야 함)
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
